# Locked evaluation thresholds for the held-out evaluation protocol.
#
# Every threshold in this file is the default argument of the
# corresponding test module's measure(...) function as of the
# locked_at_commit below. scripts/verify_thresholds.py reads this
# file and asserts that the actual defaults still match. If a
# default drifts, the verifier exits non-zero and the held-out
# evaluation refuses to run.
#
# DO NOT edit this file to make a failing run pass. Either:
#   (a) run on the held-out set first and accept what comes out, then
#       revisit thresholds based on what we learned, or
#   (b) generate a new lock file with a new version number, mark the
#       old held-out result as superseded, and rerun.

version: 1
locked_at_commit: c723eaadb33c457acbbdce5aa451c43e9b11c0ff
locked_date: "2026-05-04"
project_phase: phase-8a-holdout
notes: |
  Phase 8a development set was specimens [0, 200) of train_50k. Every
  threshold below was set or adjusted while looking at results on
  that dev set, so the dev-set numbers are NOT a fair estimate of
  held-out performance. The held-out protocol uses a fresh
  partition with these thresholds locked.

thresholds:
  trajectory_compression:
    action_threshold: 2.0      # le, action edit distance
    claim_threshold: 1.0       # le, structural claim distance
  trajectory_distinction:
    threshold: 2.0             # ge, claim distance
  step_recoverability:
    threshold: 0.70            # ge
  prediction_compression:
    threshold: 1.0             # le, structural claim distance
  prediction_distinction:
    threshold: 2.0             # ge
  goal_competence:
    threshold: 0.50            # le, failure rate
  federated_factorability:
    threshold: 0.45            # ge, score
    monotonicity_floor: 0.75   # ge
    step_factor_ceiling: 0.85  # le
  calibrated_uncertainty:
    threshold: 0.10            # le, mean abs gap to claimed coverage
    claimed_coverage: 0.90
  goal_accuracy:
    threshold: 0.50            # ge, compound accuracy
    n_atoms_tolerance: 2
    temperature_rel_tolerance: 0.25
