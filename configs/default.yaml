# Default configuration for the FMLLMadvantage pipeline.
#
# Every script reads this file (or a derivative) through
# fmllm.utils.config.load_config, which validates the YAML against the
# Pydantic schema in src/fmllm/utils/config.py. Adding a new section
# requires editing both files together.
#
# The section blocks are stubs. Each phase fleshes out the relevant
# section as that component lands.

run_id_format: "%Y%m%d-%H%M%S-{slug}"

seeds:
  numpy: 0
  torch: 0
  python: 0

# dataset: Phase 1 generator parameters.
# Generator behavior:
#   - For each specimen ID i, sample N from n_choices, sample T
#     log-uniform on [t_min, t_max], pick a motif consistent with N,
#     equilibrate via MD with a velocity-rescaling thermostat, then
#     record a md_steps_per_specimen-step trajectory snippet plus
#     image and RDF observables.
#   - The HDF5 layout uses fixed-size arrays padded to max(n_choices)
#     atoms with a per-specimen atom-count mask.
dataset:
  root: "data/synthetic_lj_v1"
  num_specimens: 50000
  num_holdout: 10000
  n_choices: [5, 7, 9, 11, 13, 17, 19, 21, 25, 30]
  n_in_distribution: [5, 7, 9, 11, 13]
  n_ood: [17, 19, 21, 25, 30]
  t_min: 0.1
  t_max: 2.0
  t_in_distribution_max: 1.0
  image_size: 64
  rdf_bins: 200
  md_steps_per_specimen: 100

  # MD integrator and equilibration.
  md_dt: 0.005
  md_equilibration_steps: 400
  md_thermostat_every: 20
  confinement_k: 0.05

  # Image rasterization.
  image_pixel_size_lj: 0.15
  image_blur_radius_lj: 0.20
  image_noise_std: 0.0

  # RDF binning and pair-distance window.
  rdf_r_max: 6.0

  # Generator runtime.
  perturbation_std: 0.02
  generator_batch_size: 256
  generator_master_seed: 1234
  holdout_fraction: null

# fm1, fm2, fm3: Phase 2 architectures and training hyperparameters.
fm1:
  name: "fm1_image"
  checkpoint_root: "checkpoints"
  epochs: 50
  batch_size: 64
  learning_rate: 3.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  warmup_epochs: 2
  num_workers: 4
  mixed_precision: true
  val_fraction: 0.10
  calib_fraction: 0.10
  conformal_alpha_levels: [0.10, 0.20]
  image_size: 64
  patch_size: 8
  embed_dim: 256
  encoder_depth: 8
  decoder_depth: 4
  num_heads: 8
  mlp_ratio: 4.0
  num_queries: 32
  max_n_atoms: 30
  box_half_width_lj: 4.8
  count_weight: 1.0
  position_weight: 5.0
  confidence_weight: 1.0
  box_constraint_weight: 0.1

fm2:
  name: "fm2_rdf"
  checkpoint_root: "checkpoints"
  epochs: 50
  batch_size: 128
  learning_rate: 3.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  warmup_epochs: 2
  num_workers: 4
  mixed_precision: true
  val_fraction: 0.10
  calib_fraction: 0.10
  conformal_alpha_levels: [0.10, 0.20]
  rdf_bins: 200
  embed_dim: 320
  depth: 6
  num_heads: 8
  mlp_ratio: 4.0
  energy_floor: -3.0
  nonneg_weight: 0.1
  huber_delta: 0.5

fm3:
  name: "fm3_traj"
  checkpoint_root: "checkpoints"
  epochs: 50
  batch_size: 32
  learning_rate: 2.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  warmup_epochs: 2
  num_workers: 4
  mixed_precision: true
  val_fraction: 0.10
  calib_fraction: 0.10
  conformal_alpha_levels: [0.10, 0.20]
  n_steps_input: 100
  max_n_atoms: 30
  embed_dim: 320
  depth: 10
  num_heads: 8
  mlp_ratio: 4.0
  equipartition_weight: 0.1
  nll_clip: 50.0

# verifier: Phase 4 fleshes this out alongside the multi-source verifier.
# Phase 4 will add per-source thresholds, simulator parameters, and the
# integrator policy.
verifier:
  literature_db: "data/literature/clusters.json"
  conformal_alpha_levels: [0.10, 0.20]

# orchestrator: Phase 5 fleshes this out alongside the OHVD loop.
# Phase 5 will add LLM serving parameters (max_tokens, top_p), tool
# specifications, and the loop's stopping criteria.
orchestrator:
  llm_model: "meta-llama/Llama-3.1-8B-Instruct"
  step_budget: 16
  temperature: 0.2
