# Held-out specimen lock for the Phase 8a holdout protocol.
#
# The Phase 8a development set was specimens [0, 200) of the
# synthetic_lj_v1 dataset. Every fix during phases 7-8a was informed
# by results on that dev set, so dev-set numbers are not a fair
# estimate of held-out performance. This lock pins a fresh range
# the orchestrator + verifier have never seen.
#
# Note on FM training overlap: the testbed was generated with
# num_holdout=0, so every specimen [0, 50000) is in the FM training
# pool. We cannot fully hold out from the FMs without regenerating
# the testbed. The held-out claim here is narrower: these specimens
# have never been collected by Pipeline A or any baseline. The FMs
# have seen them in training as supervised examples, but the
# orchestrator + verifier have never observed their FM outputs.
#
# DO NOT edit this file to point at a different range mid-protocol.
# A new range requires a new version number and a new run.

version: 2
locked_at_commit: ad9b6ba1ec97bc5b3b09afff5c9f5ab94a30c93b
locked_date: "2026-05-04"

testbed: synthetic_lj_v1
h5_path: data/synthetic_lj_v1/specimens.h5
splits_path: data/synthetic_lj_v1/splits.yaml

# Pick a contiguous range deep inside the testbed, far from the dev
# set. The picker checks non-overlap with dev_set below and aborts
# if violated.
selection:
  source: contiguous_range
  start: 40000
  count: 200

# The dev set the team has already consulted; do not pick from here.
dev_set:
  start: 0
  count: 200
  used_in: phases-7-and-8a

rationale: |
  v1 of this lock pulled from splits.yaml's holdout partition, but
  the testbed was built with num_holdout=0, so every cell is empty.
  v2 switches to a contiguous range at [40000, 40200) which is
  reproducible, disjoint from the dev set, and far from any range
  used by other scripts. If you need a fully FM-held-out partition,
  regenerate the testbed with num_holdout > 0 and switch back to
  source: splits.holdout.
