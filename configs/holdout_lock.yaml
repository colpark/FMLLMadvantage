# Held-out specimen lock for the Phase 8a holdout protocol.
#
# The Phase 8a development set was specimens [0, 200) of the
# synthetic_lj_v1 dataset. Every fix during phases 7-8a was informed
# by results on that dev set, so dev-set numbers are not a fair
# estimate of held-out performance. This lock pins a fresh partition
# the orchestrator + verifier have never seen.
#
# Note on FM training overlap: the FMs were trained on the dataset's
# train splits. The dataset's splits.yaml has a separate `holdout`
# partition that is held out from FM training. We use that partition,
# so the held-out specimens are doubly fresh: the FMs have not seen
# them, and Pipeline A has not collected them.
#
# DO NOT edit this file to point at a different range mid-protocol.
# A new range requires a new version number and a new run.

version: 1
locked_at_commit: c723eaadb33c457acbbdce5aa451c43e9b11c0ff
locked_date: "2026-05-04"

testbed: synthetic_lj_v1
h5_path: data/synthetic_lj_v1/specimens.h5
splits_path: data/synthetic_lj_v1/splits.yaml

# Source: pull from the splits.yaml `holdout` partition.
selection:
  source: splits.holdout
  cell: in_distribution
  count: 200
  order: by_specimen_id_ascending
  fallback_cells:
    - ood_n_only
    - ood_t_only
    - ood_n_and_t

# The dev set the team has already consulted; do not pick from here.
dev_set:
  start: 0
  count: 200
  used_in: phases-7-and-8a
