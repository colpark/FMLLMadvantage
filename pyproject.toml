[project]
name = "fmllm"
version = "0.1.0"
description = "Compositional World Models on a synthetic 2D Lennard-Jones testbed."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "FMLLMadvantage contributors" }]
license = { text = "Apache-2.0" }

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.5",
    "transformers>=4.45",
    "peft>=0.13",
    "trl>=0.11",
    "accelerate>=1.0",
    "datasets>=3.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "typer>=0.12",
    "rich>=13.7",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.22",
    "scikit-learn>=1.4",
    "networkx>=3.2",
    "h5py>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmllm"]

# PyTorch CUDA 12.4 wheels.
#
# The remote runs CUDA 13.1 driver 590.48.01 on H100. PyTorch built for
# cu124 is forward-compatible with this driver. On Linux uv routes the
# torch package to the cu124 index. On macOS and Windows uv falls back
# to the default PyPI wheel, which is the CPU build. That keeps local
# laptop development working for non-GPU code.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: marks tests that require a CUDA GPU",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
